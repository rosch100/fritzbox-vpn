name: Bug report
description: Report a problem with Fritz!Box VPN in Home Assistant
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This form is for bugs only. For ideas, open a feature request.

        Search [existing issues](https://github.com/rosch100/fritzbox-vpn/issues) first.

        Do not attach `home-assistant.log`, backups, passwords, or WireGuard keys.
        Prefer **Download diagnostics** (Settings → Devices & Services → Fritz!Box VPN → ⋮).
        Drag the JSON into the diagnostics field below. Redact VPN names if they should not be public.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do and what happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Without steps to reproduce, the issue is hard to fix.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Environment
  - type: input
    id: ha-version
    attributes:
      label: What version of Home Assistant Core has the issue?
      description: Settings → System → Repairs → ⋮ → System information.
      placeholder: "2026.9.0"
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: What version of Fritz!Box VPN has the issue?
      description: Settings → Devices & Services → Fritz!Box VPN.
      placeholder: "1.2.7"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Details
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics information
      description: Download diagnostics from the integration card, then drag-and-drop the JSON file here (do not copy-and-paste the content).
      placeholder: drag-and-drop the diagnostics data file here
  - type: textarea
    id: logs
    attributes:
      label: Anything in the logs that might be useful for us?
      description: Error messages or stack traces. Paste text only. Do not attach `.log` files.
      render: txt
  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Fritz!Box model and Fritz!OS if relevant, last working version, or anything else.

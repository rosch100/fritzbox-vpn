name: Feature request
description: Suggest an enhancement for Fritz!Box VPN
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/rosch100/fritzbox-vpn/issues) first.

        Do not include logs, credentials, or WireGuard key material.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is missing or painful today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like the integration to do.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Alternatives you considered, or anything else.
